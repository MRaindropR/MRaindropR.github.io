<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国城市房价走势可视化工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
    --radius: 12px;
    --up: #ef4444;
    --down: #22c55e;
    --flat: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
    color: #fff;
    padding: 32px 24px 28px;
    text-align: center;
  }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .header p { font-size: 14px; opacity: .85; }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .icon { font-size: 20px; }

  /* City selector */
  .selector-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }
  .selector-row label {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    min-width: 70px;
  }
  .city-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    background: #fff;
    user-select: none;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .chip-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    margin-left: 4px;
  }

  /* Quick-select buttons */
  .quick-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .quick-btn {
    padding: 4px 12px;
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    transition: all .15s;
  }
  .quick-btn:hover { background: var(--primary-light); border-color: var(--primary); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 2px solid var(--border); }
  .tab {
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all .2s;
    color: var(--text-secondary);
  }
  .tab:hover { color: var(--primary); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  /* Chart container */
  .chart-wrap {
    position: relative;
    width: 100%;
    height: 420px;
  }
  .chart-wrap canvas { width: 100% !important; }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: #f8fafc;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid var(--border);
  }
  .stat-city {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-city .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 3px 0;
  }
  .stat-label { color: var(--text-secondary); }
  .stat-value { font-weight: 600; }
  .val-up { color: var(--up); }
  .val-down { color: var(--down); }
  .val-flat { color: var(--flat); }

  /* Data table */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 640px;
  }
  th, td {
    padding: 10px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: #f8fafc;
    font-weight: 600;
    color: var(--text-secondary);
    position: sticky;
    top: 0;
    z-index: 1;
  }
  tr:hover td { background: #f8fafc; }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .badge-up { background: #fef2f2; color: var(--up); }
  .badge-down { background: #f0fdf4; color: var(--down); }
  .badge-flat { background: #f8fafc; color: var(--flat); }

  /* Data type filter */
  .data-type-selector {
    display: flex;
    gap: 4px;
    background: #f1f5f9;
    border-radius: 8px;
    padding: 3px;
    width: fit-content;
  }
  .data-type-btn {
    padding: 6px 16px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    color: var(--text-secondary);
  }
  .data-type-btn.active {
    background: #fff;
    color: var(--primary);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Responsive */
  @media (max-width: 640px) {
    .header h1 { font-size: 22px; }
    .chart-wrap { height: 300px; }
    .stats-grid { grid-template-columns: 1fr; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>中国城市房价走势可视化</h1>
  <p>基于国家统计局70个大中城市新建商品住宅销售价格指数</p>
</div>

<div class="container">
  <!-- City selector -->
  <div class="card">
    <div class="card-title"><span class="icon">🏙️</span> 城市选择 <span class="chip-count" id="selectedCount">0</span></div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="selectGroup('tier1')">一线城市</button>
      <button class="quick-btn" onclick="selectGroup('newTier1')">新一线城市</button>
      <button class="quick-btn" onclick="selectGroup('tier2')">二线热点</button>
      <button class="quick-btn" onclick="selectGroup('all')">全部选择</button>
      <button class="quick-btn" onclick="selectGroup('none')">清空</button>
    </div>
    <div class="selector-row">
      <div class="city-chips" id="cityChips"></div>
    </div>
  </div>

  <!-- Data type selector + Chart -->
  <div class="card">
    <div class="card-title"><span class="icon">📈</span> 房价指数趋势图</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px;">
      <div class="data-type-selector">
        <button class="data-type-btn active" data-type="mom" onclick="switchDataType('mom')">环比指数</button>
        <button class="data-type-btn" data-type="yoy" onclick="switchDataType('yoy')">同比指数</button>
        <button class="data-type-btn" data-type="fixed" onclick="switchDataType('fixed')">定基指数</button>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="mainChart"></canvas>
    </div>
  </div>

  <!-- Stats cards -->
  <div class="card">
    <div class="card-title"><span class="icon">📋</span> 关键指标摘要</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <!-- Data table -->
  <div class="card">
    <div class="card-title"><span class="icon">📊</span> 详细数据表</div>
    <div class="tabs" id="tableTabs"></div>
    <div class="table-wrap" id="tableWrap"></div>
  </div>
</div>

<div class="footer">
  数据来源：国家统计局 · 70个大中城市新建商品住宅销售价格指数<br>
  数据仅供参考，不构成任何投资建议
</div>

<script>
// ============================================================

// ============================================================
const MONTHS = [

  },
  "成都": {

  },

  },

    mom: [100.3,100.5,100.7,100.4,100.0,99.7,99.4,99.2,99.1,99.1,99.1,99.0,99.1,99.2,99.4,99.5,99.5,99.2,99.0,98.9,99.1,99.3,99.4,99.5],
  },

    mom: [100.5,100.7,100.8,100.6,100.4,100.2,100.0,99.8,99.6,99.5,99.4,99.3,99.3,99.4,99.5,99.4,99.3,99.1,99.0,99.1,99.3,99.4,99.3,99.2],

    mom: [100.2,100.4,100.5,100.2,99.8,99.5,99.3,99.2,99.0,98.9,98.9,98.8,98.8,98.9,99.0,99.0,99.0,98.8,98.7,98.8,99.0,99.1,99.0,98.9],
  },
  "郑州": {
    tier: "tier2",
    mom: [99.7,99.9,100.1,99.9,99.5,99.3,99.1,99.0,98.8,98.7,98.6,98.5,98.5,98.6,98.7,98.6,98.6,98.4,98.3,98.5,98.7,98.8,98.7,98.6],
  },
  "合肥": {
    tier: "tier2",
    mom: [100.2,100.4,100.6,100.3,99.9,99.6,99.3,99.1,99.0,99.0,99.0,98.9,99.0,99.1,99.2,99.2,99.2,98.9,98.8,98.8,99.0,99.2,99.2,99.2],
  },
  "厦门": {
    tier: "tier2",
    mom: [100.0,100.3,100.5,100.3,99.8,99.5,99.2,99.0,98.9,98.8,98.8,98.7,98.8,98.9,99.1,99.2,99.3,99.0,98.8,98.7,98.9,99.1,99.2,99.3],
  },
  "青岛": {
    tier: "tier2",
    mom: [100.0,100.2,100.3,100.1,99.7,99.4,99.2,99.1,98.9,98.8,98.8,98.7,98.7,98.8,98.9,98.9,98.9,98.7,98.6,98.7,98.9,99.0,99.0,98.9],
  },
  "大连": {
    tier: "tier2",
    mom: [99.6,99.8,100.0,99.8,99.5,99.2,99.0,98.8,98.7,98.6,98.5,98.4,98.4,98.5,98.6,98.5,98.5,98.3,98.2,98.4,98.6,98.7,98.6,98.5],
  },
  "昆明": {
    tier: "tier2",
    mom: [99.5,99.7,99.9,99.7,99.3,99.1,98.9,98.7,98.5,98.4,98.3,98.2,98.2,98.3,98.4,98.3,98.3,98.1,98.0,98.2,98.4,98.5,98.4,98.3],
  },

    mom: [99.8,100.0,100.2,100.0,99.6,99.4,99.2,99.0,98.9,98.8,98.7,98.6,98.6,98.7,98.8,98.8,98.8,98.6,98.5,98.6,98.8,98.9,98.9,98.8],
  },
};

// City groups for quick selection
const GROUPS = {
  tier1: ["北京","上海","广州","深圳"],
  newTier1: ["成都","杭州","武汉","重庆","南京","天津"],
  tier2: ["苏州","西安","长沙","郑州","合肥","厦门","青岛","大连","昆明","济南"],
};

// Colors for chart lines
const COLORS = [
  "#2563eb","#dc2626","#16a34a","#ea580c","#7c3aed",
  "#0891b2","#be185d","#ca8a04","#4f46e5","#0d9488",
  "#c026d3","#65a30d","#d97706","#6366f1","#e11d48",
  "#059669","#9333ea","#0284c7","#db2777","#84cc16"
];

// ============================================================
// Derived data: year-over-year and fixed-base
// ============================================================
function deriveYoY(mom) {
  // YoY: product of last 12 months' mom ratios, expressed as index
  return mom.map((v, i) => {
    if (i < 12) {
      // accumulate from start
      let prod = 1;
      for (let j = 0; j <= i; j++) prod *= (mom[j] / 100);
      return +(prod * 100).toFixed(1);
    }
    let prod = 1;
    for (let j = i - 11; j <= i; j++) prod *= (mom[j] / 100);
    return +(prod * 100).toFixed(1);
  });
}

function deriveFixed(mom) {
  // Fixed base: cumulative product from first month
  let base = 100;
  return mom.map(v => {
    base = +(base * (v / 100)).toFixed(2);
    return +base.toFixed(1);
  });
}

// Pre-compute derived data
Object.keys(CITY_DATA).forEach(city => {
  const d = CITY_DATA[city];
  d.yoy = deriveYoY(d.mom);
  d.fixed = deriveFixed(d.mom);
});

// ============================================================
// State
// ============================================================
let selectedCities = new Set(["北京","上海","广州","深圳"]);
let currentDataType = "mom"; // mom | yoy | fixed
let chart = null;
let tableCity = null; // currently displayed city in table

// ============================================================
// Render city chips
// ============================================================
function renderChips() {
  const container = document.getElementById("cityChips");
  container.innerHTML = "";
  Object.keys(CITY_DATA).forEach(city => {
    const chip = document.createElement("span");
    chip.className = "chip" + (selectedCities.has(city) ? " active" : "");
    chip.textContent = city;
    chip.onclick = () => toggleCity(city);
    container.appendChild(chip);
  });
  document.getElementById("selectedCount").textContent = selectedCities.size;
}

function toggleCity(city) {
  if (selectedCities.has(city)) selectedCities.delete(city);
  else selectedCities.add(city);
  refresh();
}

function selectGroup(group) {
  if (group === "none") { selectedCities.clear(); }
  else if (group === "all") { selectedCities = new Set(Object.keys(CITY_DATA)); }
  else { GROUPS[group].forEach(c => selectedCities.add(c)); }
  refresh();
}

// ============================================================
// Chart
// ============================================================
const DATA_TYPE_LABELS = { mom: "环比指数", yoy: "同比指数", fixed: "定基指数 (2023-01=100)" };

function buildChart() {
  const ctx = document.getElementById("mainChart").getContext("2d");
  if (chart) chart.destroy();

  const cities = [...selectedCities];
  const datasets = cities.map((city, i) => ({
    label: city,
    data: CITY_DATA[city][currentDataType],
    borderColor: COLORS[i % COLORS.length],
    backgroundColor: COLORS[i % COLORS.length] + "18",
    borderWidth: 2.5,
    pointRadius: 3,
    pointHoverRadius: 6,
    tension: 0.3,
    fill: false,
  }));

  chart = new Chart(ctx, {
    type: "line",
    data: { labels: MONTHS, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: {
          position: "top",
          labels: { usePointStyle: true, pointStyle: "circle", padding: 16, font: { size: 12 } },
        },
        tooltip: {
          backgroundColor: "rgba(30,41,59,.92)",
          titleFont: { size: 13 },
          bodyFont: { size: 12 },
          padding: 12,
          cornerRadius: 8,
          callbacks: {
            label: function(ctx) {
              const v = ctx.parsed.y;
              const diff = (v - 100).toFixed(1);
              const sign = diff > 0 ? "+" : "";
              return `${ctx.dataset.label}: ${v}  (${sign}${diff}%)`;
            }
          }
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { font: { size: 11 }, maxRotation: 45 },
        },
        y: {
          grid: { color: "#f1f5f9" },
          ticks: { font: { size: 11 } },
          title: { display: true, text: DATA_TYPE_LABELS[currentDataType], font: { size: 12 } },
        },
      },
    },
  });

  // Add 100-baseline annotation line
  if (currentDataType === "mom") {
    chart.options.plugins.annotation = undefined; // simple: rely on grid
  }
}

function switchDataType(type) {
  currentDataType = type;
  document.querySelectorAll(".data-type-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.type === type);
  });
  buildChart();
  renderStats();
  renderTable();
}

// ============================================================
// Stats cards
// ============================================================
function renderStats() {
  const grid = document.getElementById("statsGrid");
  grid.innerHTML = "";
  const cities = [...selectedCities];
  if (cities.length === 0) {
    grid.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;padding:12px;">请选择至少一个城市</div>';
    return;
  }

  cities.forEach((city, idx) => {
    const mom = CITY_DATA[city].mom;
    const latest = mom[mom.length - 1];
    const prev = mom[mom.length - 2];
    const avg = +(mom.reduce((a, b) => a + b, 0) / mom.length).toFixed(2);
    const max = Math.max(...mom);
    const min = Math.min(...mom);
    const trend = latest >= 100 ? "up" : "down";
    const yoyLatest = CITY_DATA[city].yoy[CITY_DATA[city].yoy.length - 1];

    const color = COLORS[idx % COLORS.length];
    const card = document.createElement("div");
    card.className = "stat-card";
    card.innerHTML = `
      <div class="stat-city"><span class="dot" style="background:${color}"></span>${city}</div>
      <div class="stat-row"><span class="stat-label">最新环比</span><span class="stat-value ${latest>=100?'val-up':'val-down'}">${latest} (${latest>=100?'+':''}${(latest-100).toFixed(1)}%)</span></div>
      <div class="stat-row"><span class="stat-label">上月环比</span><span class="stat-value ${prev>=100?'val-up':'val-down'}">${prev}</span></div>
      <div class="stat-row"><span class="stat-label">同比指数</span><span class="stat-value ${yoyLatest>=100?'val-up':'val-down'}">${yoyLatest}</span></div>
      <div class="stat-row"><span class="stat-label">24月均值</span><span class="stat-value">${avg}</span></div>
      <div class="stat-row"><span class="stat-label">最高 / 最低</span><span class="stat-value">${max} / ${min}</span></div>
    `;
    grid.appendChild(card);
  });
}

// ============================================================
// Detail table
// ============================================================
function renderTable() {
  const cities = [...selectedCities];
  const tabsEl = document.getElementById("tableTabs");
  const wrapEl = document.getElementById("tableWrap");

  if (cities.length === 0) {
    tabsEl.innerHTML = "";
    wrapEl.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;padding:12px;">请选择城市查看详细数据</div>';
    return;
  }

  // Tabs
  if (!tableCity || !selectedCities.has(tableCity)) tableCity = cities[0];
  tabsEl.innerHTML = cities.map(c =>
    `<div class="tab${c===tableCity?' active':''}" onclick="switchTableCity('${c}')">${c}</div>`
  ).join("");

  // Table
  const mom = CITY_DATA[tableCity].mom;
  const yoy = CITY_DATA[tableCity].yoy;
  const fixed = CITY_DATA[tableCity].fixed;

  let rows = MONTHS.map((m, i) => {
    const momV = mom[i];
    const momDiff = (momV - 100).toFixed(1);
    const yoyV = yoy[i];
    const yoyDiff = (yoyV - 100).toFixed(1);
    const fixV = fixed[i];

    const badge = (v) => {
      if (v > 0) return `<span class="badge badge-up">+${v}%</span>`;
      if (v < 0) return `<span class="badge badge-down">${v}%</span>`;
      return `<span class="badge badge-flat">0%</span>`;
    };

    return `<tr>
      <td>${m}</td>
      <td>${momV}</td>
      <td>${badge(momDiff)}</td>
      <td>${yoyV}</td>
      <td>${badge(yoyDiff)}</td>
      <td>${fixV}</td>
    </tr>`;
  }).reverse().join(""); // newest first

  wrapEl.innerHTML = `<table>
    <thead><tr>
      <th>月份</th><th>环比指数</th><th>环比涨跌</th><th>同比指数</th><th>同比涨跌</th><th>定基指数</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function switchTableCity(city) {
  tableCity = city;
  renderTable();
}

// ============================================================
// Refresh all
// ============================================================
function refresh() {
  renderChips();
  buildChart();
  renderStats();
  renderTable();
}

// Init
refresh();
</script>
